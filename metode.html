<!DOCTYPE html>
<html lang="nb">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kartutsnitt</title>
    <style>
        body {
        margin: 0;
        padding: 40px 20px;
        font-family: 'Times New Roman', Times, serif;
        color: black;
        background: white;
        }

        main {
        max-width: 1000px;
        margin: auto;
        }

        h1 {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        }

        img {
        display: block;
        width: 100%;
        height: auto;
        }

        figcaption {
            margin-top: 10px;
            font-size: 12px;
            color: gray;
        }

        a {
            color: inherit;
            text-underline-offset: 3px;
        }
    </style>
    </head>
    <body>
    <main>
        <h1>Kartutsnitt</h1>

        <figure>
        <img
            src="metode_1.png"
            alt="Kartutsnitt ved Lundevegen med markerte punkter."
        >
        
        <figcaption>
            Kart: &copy; <a href="https://www.norgeskart.no/"><i>norgeskart.no</i></a>
        </figcaption>
        </figure>

        <figure>
        <img
            src="metode_2.png"
            alt="Andre kartutsnitt ved Lundevegen med markerte punkter."
        >
        <figcaption>
            Kart: &copy; <a href="https://www.norgeskart.no/"><i>norgeskart.no</i></a>
        </figcaption>
        </figure>
    </main>
    </body>
</html>
